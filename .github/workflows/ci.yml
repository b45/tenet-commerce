name: Tenet Commerce CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Go Build, Vet & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: 'backend/go.sum'

      - name: Download Go dependencies
        run: go mod download

      - name: Build Go modules
        run: go build -v ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Verify Docker is available for integration tests
        run: docker info

      - name: Run Go Unit Tests with Race Detector
        run: go test -v -race -short -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run Hermetic Integration Tests (Testcontainers)
        run: go test -v -race ./integration

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.txt
          if-no-files-found: ignore

  frontend-ci:
    name: Frontend (Next.js Lint, Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js project
        run: npm run build

      - name: Run Frontend Tests (i18n Parity, Logic & UI Components)
        run: npm test

  browser-e2e:
    name: Browser E2E (Responsive and i18n Smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'

      - name: Start demo PostgreSQL and Redis
        working-directory: .
        run: docker compose up -d postgres redis

      - name: Start Go API with demo configuration
        working-directory: backend
        env:
          APP_ENV: development
          JWT_SECRET: ci-only-demo-secret-for-browser-e2e
        run: nohup go run ./cmd/api > /tmp/tenet-api.log 2>&1 &

      - name: Wait for Go API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/tenet-api.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E smoke suite
        run: npm run test:e2e

      - name: Upload sanitized browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
