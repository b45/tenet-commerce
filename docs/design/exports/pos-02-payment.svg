<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">POS-02 — Review pembayaran tunai</title>
<desc id="desc">Wireframe grayscale usulan Tenet Commerce, revision pos-lowfi-0.1. Semua data sintetis. Bukan aplikasi interaktif atau transaksi nyata. Baca spesifikasi POS_CASH_ONLINE.md untuk state gagal dan aksesibilitas.</desc>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#f5f5f5" stroke="#f5f5f5"/>
<g id="context-header"><rect x="0" y="0" width="1440" height="80" rx="0" fill="#ffffff" stroke="#d4d4d4"/><text x="32" y="35" font-family="sans-serif" font-size="20" font-weight="700" fill="#171717" text-anchor="start">TENET / POS</text><text x="32" y="60" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Tenant: toko-contoh • Kasir: Pengguna Contoh</text><text x="1408" y="36" font-family="sans-serif" font-size="14" font-weight="700" fill="#525252" text-anchor="end">DESAIN USULAN • DATA CONTOH</text><text x="1408" y="60" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="end">pos-lowfi-0.1 / 05 Sep 2026</text></g>
<text x="32" y="129" font-family="sans-serif" font-size="28" font-weight="700" fill="#171717" text-anchor="start">Pembayaran tunai</text><text x="1008" y="125" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Langkah 2 / 3 • Belum dikirim</text><g id="review-notice"><rect x="32" y="160" width="952" height="80" rx="8" fill="#eeeeee" stroke="#d4d4d4"/><text x="56" y="191" font-family="sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Periksa item, total, dan uang yang diterima.</text><text x="56" y="218" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Harga diperiksa ulang sebelum kirim; lihat dependency G-01 pada spesifikasi.</text></g><g id="order-review"><rect x="32" y="264" width="952" height="420" rx="8" fill="#ffffff" stroke="#d4d4d4"/><text x="56" y="305" font-family="sans-serif" font-size="22" font-weight="700" fill="#171717" text-anchor="start">Ringkasan belanja</text><text x="56" y="350" font-family="sans-serif" font-size="14" font-weight="600" fill="#525252" text-anchor="start">Produk</text><text x="608" y="350" font-family="sans-serif" font-size="14" font-weight="600" fill="#525252" text-anchor="end">Jumlah</text><text x="960" y="350" font-family="sans-serif" font-size="14" font-weight="600" fill="#525252" text-anchor="end">Subtotal</text><path d="M56 368H960" stroke="#d4d4d4"/><text x="56" y="410" font-family="sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Susu UHT 1 liter</text><text x="608" y="410" font-family="sans-serif" font-size="16" font-weight="400" fill="#171717" text-anchor="end">2 × Rp15.000</text><text x="960" y="410" font-family="sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="end">Rp30.000</text><path d="M56 434H960" stroke="#d4d4d4"/><text x="56" y="482" font-family="sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Roti tawar gandum</text><text x="608" y="482" font-family="sans-serif" font-size="16" font-weight="400" fill="#171717" text-anchor="end">1 × Rp10.000</text><text x="960" y="482" font-family="sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="end">Rp10.000</text><path d="M56 506H960" stroke="#d4d4d4"/><text x="56" y="571" font-family="sans-serif" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Diskon: tidak digunakan pada scope awal</text><text x="56" y="625" font-family="sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">Estimasi total bayar</text><text x="960" y="632" font-family="sans-serif" font-size="32" font-weight="700" fill="#171717" text-anchor="end">Rp40.000</text></g><rect x="32" y="718" width="272" height="48" rx="8" fill="#ffffff" stroke="#737373"/><text x="168" y="748" font-family="sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="middle">Kembali ke keranjang</text><text x="32" y="800" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Contoh: 3 unit • diskon Rp0 • pajak backend saat ini Rp0</text><g id="cash-payment"><rect x="1008" y="160" width="400" height="670" rx="8" fill="#ffffff" stroke="#d4d4d4"/><text x="1032" y="202" font-family="sans-serif" font-size="22" font-weight="700" fill="#171717" text-anchor="start">Tunai</text><text x="1032" y="236" font-family="sans-serif" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Pastikan uang sudah diterima.</text><text x="1032" y="293" font-family="sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">Uang diterima (Rp)</text><rect x="1032" y="308" width="352" height="64" rx="8" fill="#ffffff" stroke="#737373"/><text x="1050" y="349" font-family="sans-serif" font-size="28" font-weight="600" fill="#171717" text-anchor="start">50.000</text><text x="1032" y="400" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Rupiah utuh, tanpa angka desimal.</text><rect x="1032" y="420" width="160" height="48" rx="8" fill="#ffffff" stroke="#737373"/><text x="1112" y="450" font-family="sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="middle">Uang pas</text><path d="M1032 496H1384" stroke="#d4d4d4"/><text x="1032" y="532" font-family="sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">Estimasi kembalian</text><text x="1384" y="578" font-family="sans-serif" font-size="32" font-weight="700" fill="#171717" text-anchor="end">Rp10.000</text><text x="1032" y="626" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Kembalian final ada pada struk server.</text><rect x="1032" y="670" width="352" height="48" rx="8" fill="#262626" stroke="#262626"/><text x="1208" y="700" font-family="sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Konfirmasi pembayaran</text><text x="1032" y="756" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Saat diproses, jangan menagih ulang.</text><text x="1032" y="782" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Menutup halaman bukan pembatalan.</text></g>
<g id="design-footer"><path d="M32 854H1408" stroke="#d4d4d4"/><text x="32" y="880" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="start">POS-02 / Review pembayaran tunai • 1440 × 900 • Kontrol tidak interaktif</text><text x="1408" y="880" font-family="sans-serif" font-size="14" font-weight="400" fill="#525252" text-anchor="end">Grayscale = review struktur, bukan palette final</text></g>
