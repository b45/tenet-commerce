services:
  # 🗄️ PostgreSQL (Schema-per-Tenant)
  postgres:
    image: postgres:16-alpine
    container_name: tenet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenet_commerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_dev_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenet_commerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tenet_network

  # ⚡ Redis (Idempotency Key Store & Distributed Locks)
  redis:
    image: redis:7-alpine
    container_name: tenet_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tenet_network

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_PORT: 8081
      JWT_SECRET: super_secret_default_jwt_key_32_chars_long_minimum!
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: tenet_commerce
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_MAINTENANCE_MODE: "${APP_MAINTENANCE_MODE:-false}"
      APP_MAINTENANCE_MESSAGE: "${APP_MAINTENANCE_MESSAGE:-Temporarily unavailable for scheduled maintenance.}"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tenet_network

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: http://api:8081
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      NEXT_PUBLIC_DEFAULT_TENANT_SLUG: "${NEXT_PUBLIC_DEFAULT_TENANT_SLUG:-b45-bakery}"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tenet_network

volumes:
  postgres_data:
  redis_data:

networks:
  tenet_network:
    driver: bridge
